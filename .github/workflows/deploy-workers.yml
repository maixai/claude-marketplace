name: Deploy Site to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/plugin-update-times.mjs'
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'package.json'
      - 'package-lock.json'
      - 'deploy/cloudflare/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-workers-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: node:26.13-trixie
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm ci

      - name: Check header consistency
        run: npm run check:headers

      - name: Build site
        run: npm run build

      - name: Verify plugin update metadata
        run: |
          node -e "
            const catalog = require('./site/src/generated/catalog.json');
            const missing = catalog.plugins.filter((plugin) => !plugin.updatedAt);
            if (missing.length) {
              console.error('Missing updatedAt:', missing.map((plugin) => plugin.name).join(', '));
              process.exit(1);
            }
          "

      - name: Verify build output
        run: |
          test -f site/dist/index.html
          test -f site/dist/_headers

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config deploy/cloudflare/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
