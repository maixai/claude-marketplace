name: claude-marketplace

services:
  web:
    image: ${IMAGE:-claude-marketplace}:${TAG:-latest}
    build:
      context: ../..
      dockerfile: build/Dockerfile
    ports:
      - "${HOST_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
